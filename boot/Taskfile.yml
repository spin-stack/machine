# The checks of a booted machine - whether its firmware runs it, a checkpoint of the release before
# resumes, a rollback brings back what a snapshot kept, a checkpoint's pause stays short and its guest continues at once on a busy host, a workspace grows after one, what a guest sees of each carried patch, sshd delays only a failure, lockdown, logind, a core hot-added - and
# the probes still Go tests: firmware-stages and waits. They boot VMs, need /dev/kvm and a built release, and `go test ./...` skips every one
# unless its SPIN_* switch is set, which is what these targets do. Each boots the release tree
# OUTPUT_DIR names; `spin-machine-dev lab check TARGET --tree NAME=SPEC` runs one on any tree, on the
# bench fleet too (lab.yml's check:TARGET).
#
# The goal's numbers and the kernel's breakdown are spin-machine-dev lab's probes (ssh-first,
# restore-first, prestart, initcalls; docs/cli.md); the targets of those names run them over
# OUTPUT_DIR, here, where a laptop finds leads and decides nothing.

version: '3'

env:
  SPIN_MACHINE_OUTPUT: '{{.OUTPUT_ABS}}'

tasks:
  record:
    desc: >-
      The machine's record (machine.QEMU.Target) at spin's shape: a machine resumes its own
      checkpoint after a memory plug, the balloon, a vCPU and a disk; what QEMU loads silently -
      an extra vsock, SeaBIOS for qboot, more base RAM - is refused by name, and more hotplug
      targets are not; the BIOS block is the BIOS file's size; the record holds the
      x-consistent-cache=off -cpu gives, and refuses by name a checkpoint whose machine had leaf 2
      at 0xFF or whose record holds no vCPU property, as one from before #569 (record_test.go). A checkpoint's
      save and its loads, in full and fast, send the MIGRATION events the machine waits on, in the
      order it relies on (events_test.go). What QEMU says of a machine's end, a checkpoint's cost,
      Hold and the guest's memory reports, on real guests (verbs_test.go). Needs a built release,
      /dev/kvm and /dev/vhost-vsock.
    deps: [':tools']
    cmds:
      - SPIN_RECORD_TEST=1 go test ./boot/ -run '^(TestTheRecordRefusesWhatQEMULoadsSilently|TestACheckpointIsWaitedOnByItsEvents|TestTheMachineSaysHowItEnded|TestACheckpointedMachineIsHeldThenContinued)$' -count=1 -v -timeout 5m

  patches:
    desc: >-
      What a guest sees of each QEMU and qboot patch only a guest can see, at spin's shape: the
      SCSI host refuses a scan past the 16 targets max_target gives it (qemu/patches/0002), the firmware enabled
      the MTRRs (qboot's mtrr.patch), and a guest restored from a checkpoint whose TSC is within
      KVM's second of the new vCPU's keeps its clock, its timers due at the save firing at once
      rather than ~650 ms late (qemu/patches/0005, #472); and what the host sees of the kernel
      patches only the running machine can make earn: a cold boot to userspace stays under its
      port I/O exit budget, KVM's io_exits read through query-stats (kernel/patches/0004 and
      0010, #486) (patches_test.go). REPS= boots counted for the exits (default 3). Needs a built
      release, /dev/kvm and /dev/vhost-vsock.
    deps: [':tools']
    cmds:
      - SPIN_PATCHES_TEST=1 go test ./boot/ -run '^(TestTheGuestSeesWhatEachPatchGivesIt|TestARestoredGuestKeepsItsClock|TestPCIConfigurationCostsNoPortExits)$' -count=1 -v -timeout 10m

  rollback:
    desc: >-
      What a snapshot keeps, at spin's shape booted to systemd and logged into over SSH through
      vsock: the terminal loop of #408 and a process holding random bytes go on through a
      checkpoint with memory continued in place; a rollback with memory onto the sealed disk brings
      back a file, read from memory and from the disk, the bytes and the process as they were at
      the checkpoint, and reseeds the guest's RNG; a cold boot from the sealed disk has what was
      synced before the seal and not what came after; a disk-only snapshot, stop and cont around
      blockdev-snapshot, leaves the process running (rollback_test.go). Logs each pause's cost from
      the guest's own output, the guest's clock against the host's, and what became of an SSH
      session open at the checkpoint. Needs a built release, /dev/kvm and /dev/vhost-vsock.
    deps: [':tools']
    cmds:
      - SPIN_ROLLBACK_TEST=1 go test ./boot/ -run '^TestARollbackBringsBackTheSameMemoryAndDisk$' -count=1 -v -timeout 10m

  checkpoint-pause:
    desc: >-
      How long a checkpoint stops the guest, at spin's shape plugged to 2 GiB: an idle guest with
      1.5 GiB of tmpfs filled, one rewriting 64 MiB of a 512 MiB set every ~100 ms, that one beside a
      busy host disk, and beside it on a host whose memory is taken but 4 GiB (measured, not held, and skipped on a host with
      swap, which no runner has), each saved SPIN_PAUSE_SAVES times (default 10) and continued. Logs each save's pause (GuestStopped to
      GuestRunning), QEMU's downtime, what was left at the stop and the save's total, and holds the
      median pause under 50 ms (pause_test.go). Needs a built release and /dev/kvm. SKIP= a go test
      -skip pattern of the guests to leave out.
    deps: [':tools']
    cmds:
      - SPIN_PAUSE_TEST=1 go test ./boot/ -run '^TestACheckpointPausesTheGuestBriefly$' {{if .SKIP}}-skip '{{.SKIP}}'{{end}} -count=1 -v -timeout 15m

  finish-migrate:
    desc: >-
      A Continue right after a checkpoint is never refused while QEMU is in finish-migrate (#421):
      spin's shape plugged to 2 GiB with a writer in the guest, QEMU and the test on the host's
      last two CPUs, which a spin loop each keeps busy, SPIN_FINISH_SAVES checkpoints (default
      300), each continued at once (finish_test.go). Not in CI: an idle host does not reach the
      window, and this takes minutes. It is how a qemu bump is checked for it (versions.yaml).
      Needs a built release, /dev/kvm and taskset.
    deps: [':tools']
    cmds:
      - SPIN_FINISH_TEST=1 taskset -c "$(($(nproc) - 2)),$(($(nproc) - 1))" go test ./boot/ -run '^TestACheckpointIsContinuedAtOnceOnABusyHost$' -count=1 -v -timeout 30m

  disk-limit:
    desc: >-
      A disk limit (machine.QEMU.SetDiskLimit) on a real guest at spin's shape with two disks
      beside its root: the guest's direct reads of one slow to its bytes a second and its direct
      writes to its IOPS while the other's run free, both recover once it is cleared, QEMU reads
      each limit back as set, a disk attached while it runs is held the same way, and a machine
      resumed from a checkpoint runs without the limit until it is set again (disklimit_test.go). Needs a built release, /dev/kvm and /dev/vhost-vsock.
    deps: [':tools']
    cmds:
      - SPIN_DISK_LIMIT_TEST=1 go test ./boot/ -run '^TestADiskLimitHoldsOneDiskAndLetsItGo$' -count=1 -v -timeout 5m

  buildkit:
    desc: >-
      Use the BuildKit builder named compat, made the first time: a docker-container builder,
      which reads and exports a cache (CACHE_BACKEND) where Docker's own cannot.
    cmds:
      - docker buildx inspect compat > /dev/null 2>&1 && docker buildx use compat || docker buildx create --use --name compat --driver docker-container

  here:
    desc: >-
      This change's machine: the newest release, fetched and checked against its sha256 and its
      signature, with this tree's QEMU, firmware and spin-machine in place of its own, and its
      kernel when one is built (spin-machine-dev lab tree here, in _output/trees/here). Exported
      to the steps after in CI as SPIN_MACHINE_OUTPUT. Needs a built or fetched QEMU. QEMU= another
      directory laid out as _output's QEMU is (sanitize.yml's sanitized one).
    # The base image is the release's: a checkpoint resumes with the disks it was saved with. So
    # are the e2fsprogs tools that edit a copy of it (boot:lockdown's debugfs) and qemu-img, which
    # makes the overlays. Without a built kernel, the release's: compat builds one only for a
    # change that reaches it.
    cmds:
      - |
        set -euo pipefail
        kernel=()
        if [ -f {{.OUTPUT_ABS}}/kernel/vmlinux ]; then kernel=(--kernel {{.OUTPUT_ABS}}/kernel/vmlinux); fi
        here=$(go run ./cmd/spin-machine-dev lab tree here --qemu {{.QEMU | default .OUTPUT_ABS}} "${kernel[@]}" --spin-machine here)
        echo "SPIN_MACHINE_OUTPUT=$here" >> "${GITHUB_ENV:-/dev/stdout}"

  compat:
    desc: >-
      A checkpoint of every release until one whose machine is not this one (machine.CanResume)
      resumes on this tree's build: spin-machine-dev lab compat over a built release. Needs /dev/kvm,
      /dev/vhost-vsock and gh.
    deps: [':tools']
    cmds:
      - go run ./cmd/spin-machine-dev lab compat --here {{.OUTPUT_ABS}}

  logind:
    desc: >-
      Check first SSH login, reconnect, user services and logout in a disposable guest.
      Needs a built release; uses KVM when available, otherwise TCG.
      The image starts logind at boot, so the first login does not, and this checks that
      logins get a real session. SPIN_LOGIND_NO_SEATS=1 holds logind back from the boot and
      removes the drop-in that lets an early login still activate it, and is expected to
      fail, not to measure anything.
    deps: [':tools']
    cmds:
      - SPIN_LOGIND_TEST=1 go test ./boot/ -run '^TestLogindSessions$' -count=1 -v -timeout 5m

  workspace:
    desc: >-
      Check what a workspace expects of the image in a disposable guest: no failed unit, the journal,
      the timers, dpkg and apt, the locale, sudo, /tmp, debugfs by hand, and docker running a
      container by its socket; and that what docs/image.md says the image gives up is still given
      up. Needs a built release; uses KVM when available, otherwise TCG.
    deps: [':tools']
    cmds:
      - SPIN_WORKSPACE_TEST=1 go test ./boot/ -run '^TestAWorkspaceHasWhatItExpects$' -count=1 -v -timeout 5m

  pressure:
    desc: >-
      The pressure probe on a real guest: this checkout's sender in a disposable root, a guest of
      one vCPU put under each pressure in turn (its CPU short, the host's hogs on its vCPU's core,
      its disk, its memory, an OOM, then cpu.max, memory.high and io.max set on QEMU's cgroup),
      and each phase checked for the Pressure that names it and Usage for counters that moved; a
      machine adopted into a second listener's watch (Adopt) once the first is closed, checked for
      the guest's CPU stall, the host's and cpu.max's Limited; and the sender alone on this host,
      its CPU overloaded and a cgroup made to kill. Runs as root through sudo, for the host's triggers and the cgroup QEMU runs in. Needs a built
      release, /dev/kvm, /dev/vhost-vsock (task vsock), sudo, and SCRATCH (lab check's scratch,
      default OUTPUT_DIR) on a block device, where io.max's disk is written. SPIN_PRESSURE_CORE= the host core the vCPU and the hogs
      share (default 3).
    cmds:
      - mkdir -p {{.OUTPUT_ABS}}/guest
      - CGO_ENABLED=0 go build -trimpath -o {{.OUTPUT_ABS}}/guest/spin-machine-pressure ./cmd/spin-machine-pressure
      - SPIN_PRESSURE_TEST=1 SPIN_PRESSURE_SENDER={{.OUTPUT_ABS}}/guest/spin-machine-pressure SPIN_PRESSURE_DISK_DIR={{.SCRATCH | default .OUTPUT_ABS}}/pressure go test ./machine/ ./cmd/spin-machine-pressure/ -exec 'sudo -n --preserve-env=SPIN_PRESSURE_TEST,SPIN_PRESSURE_SENDER,SPIN_PRESSURE_DISK_DIR,SPIN_PRESSURE_CORE,SPIN_MACHINE_OUTPUT' -run '^(TestThePressureProbeReportsEachPressure|TestAnAdoptedMachinesPressureIsHeard|TestTheSenderReportsTheHostsOwnPressure)$' -count=1 -v -timeout 10m

  overhead:
    desc: >-
      What a machine's QEMU uses beyond its guest, and the files it opens by name: spin's shape
      started as nobody in a root holding only machine.Spec.Files and /dev/null, in a cgroup of its
      own, taken to its ceiling (every vCPU, all its memory, four disks, one of 64 GiB),
      checkpointed and continued while the guest fills its memory and reads, writes and trims every
      disk, and checkpointed again. QEMU's cgroup may hold no more than Spec.Overhead and each Disk.Overhead
      beyond the guest's RAM, nor more tasks (overhead_lane_test.go). Runs as root through sudo,
      for the root, the TAP and the cgroup. Needs a built release, /dev/kvm, /dev/vhost-vsock,
      /dev/vhost-net, sudo, ~9 GiB of free memory and as much disk under TMPDIR.
    cmds:
      - SPIN_OVERHEAD_TEST=1 go test ./machine/ -exec 'sudo -n --preserve-env=SPIN_OVERHEAD_TEST,SPIN_MACHINE_OUTPUT env TMPDIR={{.TMPDIR | default "/tmp"}}' -run '^TestAMachineRunsInARootOfItsFilesWithinItsOverhead$' -count=1 -v -timeout 20m

  sshd-delay:
    desc: >-
      sshd keeps OpenSSH's userauth minimum time for a failure and skips it for a login that
      succeeds (image/openssh): spin's shape booted to systemd and logged into as root over vsock;
      every turn of a refused key and of a user that does not exist takes 5 ms or more, and the
      median of SPIN_SSHD_LOGINS logins' key query and signed request (default 10) each less
      (sshd_test.go). Needs a built release, /dev/kvm and /dev/vhost-vsock.
    deps: [':tools']
    cmds:
      - SPIN_SSHD_DELAY_TEST=1 go test ./boot/ -run '^TestSSHDDelaysOnlyAFailure$' -count=1 -v -timeout 5m

  shell:
    desc: >-
      spin-machine-dev shell over the release reaches a root prompt with systemd as PID 1, and the
      base image is unchanged after (shell_test.go). The image has no autologin, so the prompt is
      shell's own credential at work. Needs a built release and /dev/kvm.
    deps: [':tools']
    cmds:
      - SPIN_SHELL_TEST=1 go test ./boot/ -run '^TestShellIsRootUnderSystemd$' -count=1 -v -timeout 5m

  lockdown:
    desc: >-
      Check the guest kernel runs lockdown at confidentiality with its keyrings sealed, or at
      integrity with them open for a shirudo machine (#734, #741), and the BPF LSM, has no /dev/mem or /proc/kcore, and is at a random address (KASLR), in a disposable guest. Needs a built release; uses KVM when
      available, otherwise TCG.
    deps: [':tools']
    cmds:
      - SPIN_LOCKDOWN_TEST=1 go test ./boot/ -run '^TestTheGuestKernelIsLockedDown$' -count=1 -v -timeout 5m

  kaslr:
    desc: >-
      Check the kernel's virtual base, physical base and RANDOMIZE_MEMORY regions each move,
      across SPIN_KASLR_BOOTS boots (default 10) in spin's base shape (kaslr_test.go, #645).
      Needs a built release and /dev/kvm.
    deps: [':tools']
    cmds:
      - SPIN_KASLR_TEST=1 go test ./boot/ -run '^TestTheKernelMovesEveryBoot$' -count=1 -v -timeout 15m

  cpu-plug:
    desc: >-
      A workspace checkpointed with memory and continued still grows: spin's shape booted to
      systemd at 2048 MiB, logged into over SSH, checkpointed, continued, then given every vCPU,
      8192 MiB and four disks at once, has all of them within 20 s of the plug, in
      SPIN_CPUPLUG_RUNS guests (default 10) (cpuplug_test.go, #433). Needs a built release, /dev/kvm
      and /dev/vhost-vsock.
    deps: [':tools']
    cmds:
      - SPIN_CPUPLUG_TEST=1 go test ./boot/ -run '^TestAWorkspaceCheckpointedAndContinuedGrows$' -count=1 -v -timeout 10m

  actuators:
    desc: >-
      What the actuators cost inside a running workspace (docs/machine.md, "Actuators"; #549):
      spin's shape booted to systemd at 2048 MiB, given SetMemory down to 1024 MiB idle and with
      the page cache full, and SetCPUs +1 and -1, timed until /sys/devices/system/memory and
      /sys/devices/system/cpu/online show it, SPIN_ACTUATORS_REPS times each (default 10)
      (actuators_test.go). Needs a built release, /dev/kvm and /dev/vhost-vsock.
    deps: [':tools']
    cmds:
      - SPIN_ACTUATORS_TEST=1 go test ./boot/ -run '^TestWhatTheActuatorsCost$' -count=1 -v -timeout 60m

  hotadd:
    desc: >-
      Check a core attached while an init of the consumer's is PID 1, before systemd and its
      udev start, is online once they have, in a disposable guest. Needs a built release; uses
      KVM when available, otherwise TCG.
    deps: [':tools']
    cmds:
      - SPIN_HOTADD_TEST=1 go test ./boot/ -run '^TestACoreAttachedBeforeSystemdStartsComesOnline$' -count=1 -v -timeout 5m

  initcalls:
    desc: >-
      Where the kernel's own boot goes, initcall by initcall, over OUTPUT_DIR: spin-machine-dev lab
      run initcalls (its --help). Needs KVM and sudo. REPS= boots, TOP= rows.
    cmds:
      - go run ./cmd/spin-machine-dev lab run initcalls --tree 'here=--from {{.OUTPUT_ABS}}' --reps {{.REPS | default 10}} --opt top={{.TOP | default 30}}

  waits:
    desc: >-
      What waited on what between the kernel handing over and a login prompt, on the host's
      clock: each unit's own time against the lag before it started, the critical path to the
      login that accounts for every millisecond of it, the intervals no unit was working, and
      what is still starting behind the prompt. Read after the boot from systemd's timestamps.
      Needs KVM, a built release and sudo. REPS= boots, TARGET= the login unit, TOP= rows,
      GAP= the shortest idle interval in ms, RAW=<dir> keeps each boot's dump.
    deps: [':tools']
    cmds:
      - SPIN_BOOT_WAITS=1 go test ./boot/ -run '^TestBootWaits$' -count=1 -v -timeout 20m

  ssh-first:
    desc: >-
      The goal's first number over OUTPUT_DIR, the lane as this checkout builds it in its image:
      spin-machine-dev lab run ssh-first (its --help). Needs KVM, /dev/vhost-vsock (task vsock)
      and sudo. REPS= boots.
    cmds:
      - go run ./cmd/spin-machine-dev lab run ssh-first --tree 'here=--from {{.OUTPUT_ABS}} --edit lane' --reps {{.REPS | default 10}}

  restore-first:
    desc: >-
      The goal's second number over OUTPUT_DIR, this checkout's spin-machine and lane:
      spin-machine-dev lab run restore-first (its --help). Needs KVM, /dev/vhost-vsock (task vsock),
      sudo and a TMPDIR on a disk. REPS= repetitions.
    cmds:
      - go run ./cmd/spin-machine-dev lab run restore-first --tree 'here=--from {{.OUTPUT_ABS}} --spin-machine here --edit lane' --reps {{.REPS | default 10}}

  prestart:
    desc: >-
      A QEMU started ahead against today's, booted and restored, over OUTPUT_DIR:
      spin-machine-dev lab run prestart (its --help). Needs KVM, /dev/vhost-vsock (task vsock),
      sudo and a TMPDIR on a disk. REPS= repetitions.
    cmds:
      - go run ./cmd/spin-machine-dev lab run prestart --tree 'here=--from {{.OUTPUT_ABS}} --spin-machine here --edit lane' --reps {{.REPS | default 10}}

  firmware-stages:
    desc: >-
      Where the time before the kernel goes on the machine a workspace boots: QEMU's start and
      each of the firmware's steps (PCI walk, fw_cfg directory, ACPI, e820, SMBIOS, command
      line, initrd, kernel), from QEMU's own trace of the firmware's fw_cfg selects and exits;
      then the jump to the kernel's clock (the bzImage's decompression), the kernel to
      "Freeing" and the rest, by kvm-clock. Needs KVM and a built release; no sudo. REPS=
      boots, SPIN_MACHINE_OUTPUT_B= a tree beside it.
    deps: [':tools']
    cmds:
      - SPIN_FIRMWARE_STAGES=1 go test ./boot/ -run '^TestFirmwareStages$' -count=1 -v -timeout 20m

  firmware:
    desc: >-
      Whether the machine's firmware runs it: qboot boots, publishes vmgenid's table and
      survives a restore with the guest reseeding - a firmware with no WRITE_POINTER loses
      vmgenid, and a lost vmgenid has no symptom - and SeaBIOS, the fallback, still boots.
      Needs KVM and a built release; SPIN_PROBE_INITRD= names a diagnostic initrd, and
      without it boot/probeinit is built into one.
    deps: [':tools']
    cmds:
      - SPIN_FIRMWARE_PROBE=1 go test ./boot/ -run '^TestFirmwareRuns$' -count=1 -v -timeout 20m

