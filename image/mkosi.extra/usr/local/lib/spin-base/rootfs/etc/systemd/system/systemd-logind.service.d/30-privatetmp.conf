# logind without a private /tmp. PrivateTmp= orders a unit after systemd-tmpfiles-setup.service,
# which waits for local-fs.target; DefaultDependencies=no (10-lane.conf) does not take that back,
# and it held logind, and with it the first login's session, behind the filesystems: without it
# logind started ~50 ms sooner (laptop, 2026-11-21). Measured with the rest of spin's login path
# early (ssh.socket.d/10-lane.conf).
#
# What it costs: logind sees the machine's /tmp instead of an empty one of its own. Under its
# ProtectSystem=strict that /tmp is read-only to it, and logind keeps nothing in /tmp.
[Service]
PrivateTmp=no
