# ssh.service starts sshd without asking another sshd to check the configuration first. Ubuntu's
# unit runs `sshd -t` as ExecStartPre, and on the one vCPU everything before the forwarder shares
# the CPU: that exec and the executor's that starts it are ~3 ms of the cold first login, -3.2
# [-7.2, -0.8] ms p50 without it, sshd accepting -2.4 [-6.4, -1.1] (bench fleet, spin's shape and
# login, 60 boots each interleaved, lab 44977044826, 2026-11-22).
#
# Nothing is lost at start: `sshd -D` parses the same configuration and refuses to start on an
# error, as `sshd -t` would, and Restart=on-failure with RestartPreventExitStatus=255 treats both
# the same way. The check stays where it protects something, on reload (ExecReload=), which
# spin's supervisor runs when it installs the user CA: a bad configuration then leaves the
# running sshd alone instead of sending it a SIGHUP it would die on.
[Service]
ExecStartPre=
