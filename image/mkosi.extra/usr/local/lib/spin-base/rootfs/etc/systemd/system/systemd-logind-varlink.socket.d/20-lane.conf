# The first SSH login's lane: logind's Varlink socket, without systemd's default dependencies,
# as logind itself is (systemd-logind.service.d/10-lane.conf).
#
# The service waits for its socket, and the socket kept After=sysinit.target: logind was ready
# ~230 ms into the boot, behind udevd (boot:waits TARGET=systemd-logind.service, lab run
# 44557605832), and the first login's pam_systemd waited for it to start - ~32 ms from PAM's
# session open to logind's new session, against 1 ms for the second login (login-lane with
# SPIN_LANE_DIAG, lab run 44557162195). Without them, on the bench fleet, 20 boots of each
# interleaved (lab runs 44558035927, 44558053261, 2026-11-19): that hop 24.5/41.8 -> 15.8/22.7
# ms, accept to login 131/137 -> 120/128, the first login 332/355 -> 328/337 - the p50 moves
# little because logind starting sooner takes the CPU sshd was starting on. Ordering logind
# after modprobe@drm cost nothing measurable either way (masked: 327/345).
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target
