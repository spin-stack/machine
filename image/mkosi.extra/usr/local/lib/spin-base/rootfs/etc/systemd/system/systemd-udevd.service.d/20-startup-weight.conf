# udev's coldplug after the first login while the machine boots, not beside it.
#
# spin boots one vCPU, and on one vCPU the guest is busy from the kernel's start to the first
# login: /proc/stat read 0 ms idle at it, and the boot's work up to it was ~225 ms of CPU at one
# vCPU and at two alike (root cgroup's cpu.stat; laptop, 2026-11-20, plugged to 2048 MiB). What one
# vCPU costs is the work the second CPU ran beside the login, run before it instead. udevd and its
# workers are the largest part of that the login does not need: ~35-40 ms of CPU, ~15 workers for
# ~25 events, against ~13 for logind and ~20 for the login's sshd. The lane does not wait for udev
# (its 10-lane.conf drop-ins), so at the lowest weight while the boot runs the workers take the CPU
# the lane leaves. Raising the lane's weight instead was worth nothing at two vCPUs (docs/lab.md,
# "Measured and rejected", lab 43518915618), where there was CPU to spare.
#
# StartupCPUWeight and not CPUWeight: it holds only until the boot's jobs are done, so a device a
# running workspace hot-plugs - a core, a block of memory, a disk - is handled at udev's usual
# weight. Every event is still handled: a weight is a share of a contended CPU, never a wait.
#
# On spin's own login path (the lab's login=spin) it gains nothing yet: sshd there is ssh.service,
# after basic.target, and sysinit.target waits for udevd to be ready, so the login waits for udev
# whatever its weight (laptop: first login 307 against 308 ms, the forwarder's accept 7 ms later).
[Service]
StartupCPUWeight=1
