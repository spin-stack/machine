# spin's login path: the one long-running sshd behind ssh.socket, without systemd's default
# dependencies, so it does not wait for basic.target. It still waits for its host keys
# (spin-machine-sshd-keygen.service, Before=ssh.service) and for the socket. Its own After= names
# network.target, nss-user-lookup.target and auditd.service, which nothing in this boot starts.
# What it was worth is in ssh.socket.d/10-lane.conf.
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target
