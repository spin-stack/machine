# Ubuntu's first-boot host key generation, wanted by ssh.service and ordered before it. Its
# ConditionFirstBoot never holds here (spin-machine-sshd-keygen.service makes the keys), but a job
# waits for its ordering before its condition is checked: with its default dependencies it held
# ssh.service until basic.target, so ssh.service without default dependencies of its own still
# started right after basic.target (laptop, v20261120.03, 2026-11-21).
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target
