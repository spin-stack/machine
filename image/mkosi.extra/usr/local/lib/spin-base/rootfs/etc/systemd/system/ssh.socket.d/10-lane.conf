# spin's login path: ssh.socket, which spin's supervisor forwards vsock port 22 to (127.0.0.1:22),
# without systemd's default dependencies, so it does not wait for sysinit.target (udev's coldplug,
# journald, tmpfiles).
#
# Together with ssh.service and sshd-keygen.service (their 10-lane.conf), logind and dbus-broker
# without a private /tmp (30-privatetmp.conf) and udev at the lowest CPU weight while the boot
# runs (20-startup.conf), the cold first login on spin's path came -59.4 [-65.9, -56.2] ms p50,
# sshd accepting 56 ms sooner, on the bench fleet in spin's shape (lab 44805051310, 20 boots each,
# 2026-11-21, the probe's forwarder ordered as early). The order alone was -10.8 [-16.3, -5.2]:
# the login then ran beside udev's coldplug on the one vCPU, which the weight lets it pass.
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target
