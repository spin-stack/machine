# Every login's user manager, started beside the session rather than before logind answers it.
#
# Sessions are of class user-early-light (configure-system.sh), and logind starts no manager for
# one. Nobody lingers either, so from 2026-11-20 (v20261120.03, spin stopped lingering) no login
# had a manager: systemctl --user failed, and so did every user unit (#462). logind starts this
# unit for every session, a light one included, and waits for it alone (systemd v259.9,
# src/login/logind-session.c: session_job_pending). The manager it wants is ordered after it, so
# the login does not wait for a systemd --user. A command that needs the user bus right away in
# the first login can still arrive before the manager does (#467).
#
# Bench, spin's shape and login, 20 a side against v20261122.01 (labs 44987167474, 44987167549,
# 2026-11-22): first login +2.6 [-4.0, +8.7], restored login +0.8 [-1.5, +4.5], both within
# noise. Class user-early, which holds the login until the manager answers, cost the first login
# +36.2 [+32.0, +45.7] in the same run.
[Unit]
Wants=user@%i.service
