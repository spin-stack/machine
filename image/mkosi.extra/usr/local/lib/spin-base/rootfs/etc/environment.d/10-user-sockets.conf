# The user manager's environment for its two sockets, read once when it starts, in place of the
# `systemctl --user set-environment` that dbus.socket and ssh-agent.socket each run when they
# start (their 10-env.conf drop-ins take those away). A login waits for its user manager (class
# user-early, configure-system.sh), and the two execs were ~15 ms of its ~48 on the one vCPU.
# Taking them away moved the first login -17.1 [-27.0, -10.7] against class user-early alone
# (bench, spin's shape and login, 20 a side, lab 45030778365, 2026-11-22). The manager's
# environment holds the same two variables either way.
DBUS_SESSION_BUS_ADDRESS=unix:path=${XDG_RUNTIME_DIR}/bus
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/openssh_agent
