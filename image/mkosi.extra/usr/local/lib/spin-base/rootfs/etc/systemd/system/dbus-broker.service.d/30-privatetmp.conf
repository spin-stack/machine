# The system bus without a private /tmp, for the reason logind is (systemd-logind.service.d/
# 30-privatetmp.conf): PrivateTmp= orders it after systemd-tmpfiles-setup.service, and logind and
# the user's runtime directory wait for the bus.
#
# What it costs: the broker, root under ProtectSystem=full, can read and write the machine's /tmp
# instead of an empty one of its own. It keeps nothing in /tmp.
[Service]
PrivateTmp=no
