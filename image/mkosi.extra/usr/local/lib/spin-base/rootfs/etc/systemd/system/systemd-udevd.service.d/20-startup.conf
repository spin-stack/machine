# udevd and its workers at the lowest CPU weight until the boot's jobs are done, so the first
# login, started beside udev's coldplug (ssh.socket.d/10-lane.conf), gets the one vCPU first.
# StartupCPUWeight= holds only while the boot runs: a device plugged later is handled at the
# normal weight. Alone it did nothing on spin's path, where the login waited for basic.target,
# which waits for udev (#329); with the login early it is most of the -59.4 ms there.
#
# What it costs, same run (lab 44805051310): the console prompt +51 ms (the serial getty waits for
# dev-ttyS0.device, which the coldplug announces) and the second login +6.1 ms (udev's deferred
# work runs after the first login).
[Service]
StartupCPUWeight=1
