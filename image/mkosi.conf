# docs/image.md, "The toolchain"

[Config]
MinimumVersion=27.1

[Build]
Incremental=yes
CacheDirectory=/cache
WithNetwork=yes
Environment=TASK_VERSION TASK_SHA256 GIT_LFS_VERSION GIT_LFS_SHA256 BUILDKIT_VERSION BUILDKIT_SHA256

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main,restricted,universe,multiverse

[Output]
Format=directory
OutputDirectory=/work/out
Output=rootfs
ImageId=spin-base

[Content]
# docs/image.md, "How the image is assembled"
ExtraTrees=mkosi.extra

WithDocs=no
CleanPackageMetadata=no

# docs/image.md, "The package list"
Packages=
        apt
        dpkg
        coreutils
        coreutils-from-gnu
        coreutils-from-uutils-
        rust-coreutils-
        login
        passwd
        adduser
        locales
        findutils

        systemd
        systemd-sysv
        libpam-systemd
        libpcre2-8-0
        dbus-broker
        udev

        openssh-server
        sudo

        git
        curl
        wget
        ca-certificates
        make
        jq
        nano
        less
        strace
        btop
        bubblewrap
        socat
        ripgrep
        file

        bash
        sed
        gawk
        grep
        diffutils
        patch
        gzip
        xz-utils
        unzip

        procps
        util-linux
        util-linux-extra
        kmod
        pciutils
        ethtool

        iproute2
        net-tools
        iputils-ping
        dnsutils
        netcat-openbsd
        iptables
        arptables
        ebtables
        nftables

        isal
        pigz

# docs/image.md, "The package list"
RemoveFiles=
        /etc/hostname
        /etc/resolv.conf
        /etc/ssh/ssh_host_*
        /var/lib/dbus/machine-id
        /var/log/journal
        /var/cache/apt/archives
