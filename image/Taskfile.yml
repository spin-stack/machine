version: '3'

# The base image. See image/mkosi.conf for what goes into it and image/build.sh for how the
# tree becomes a partitionless ext4 in a read-only qcow2.

tasks:

  build:
    desc: Build rootfs.qcow2 (Ubuntu 26.04 userland, ext4, partitionless) into _output/.
    cmds:
      - task: builder
      - mkdir -p {{.OUTPUT_ABS}} {{.MKOSI_CACHE_DIR}}
      # `docker run` and not `docker buildx build`, and the reason is in image/Dockerfile:
      # mkosi assembles a root filesystem by unsharing a user and mount namespace and
      # BuildKit forbids that. The flags below are exactly what it needs and nothing more —
      # not --privileged.
      - |
        docker run --rm \
          --security-opt seccomp=unconfined \
          --security-opt apparmor=unconfined \
          --cap-add SYS_ADMIN \
          -v {{.OUTPUT_ABS}}:/out \
          -v {{.MKOSI_CACHE_DIR}}:/cache \
          {{if .SYSTEMD_DEBS}}-v {{.SYSTEMD_DEBS}}:/debs:ro{{end}} \
          {{.IMAGE_BUILDER_TAG}}

  summary:
    desc: What the built base image is, by size and sha256.
    cmds:
      - |
        set -e
        ls -la {{.OUTPUT_ABS}}/image/rootfs.qcow2
        echo "sha256: $(sha256sum {{.OUTPUT_ABS}}/image/rootfs.qcow2 | cut -d' ' -f1)"

  systemd:
    desc: >-
      EXPERIMENT (branch systemd-stage1): Ubuntu's systemd rebuilt from its deb-src with the stage1
      profile and SELinux off, once for each variant, into _output/exp-systemd/debs/<variant>.
      boot:ssh-first and boot:restore-first take each as a row with SPIN_SYSTEMD_DEBS.
    cmds:
      - rm -rf {{.OUTPUT_ABS}}/exp-systemd/debs
      - for:
          # The variants, by meson options after the packaging's own. static: the binaries the
          # boot execs most - systemd-executor once for every unit started, udevd and its
          # helpers - and the two command-line tools, with libsystemd-shared linked in instead
          # of loaded. PID 1, journald and logind have no such option. No LTO variant: Ubuntu's
          # dpkg-buildflags already compile with -flto=auto, and -Db_lto=true built the same
          # packages to within a few hundred bytes (2026-11-19).
          - stage1=
          - stage1-static=-Dlink-executor-shared=false -Dlink-udev-shared=false -Dlink-systemctl-shared=false -Dlink-journalctl-shared=false
        cmd: |
          set -euo pipefail
          variant='{{.ITEM}}'
          name=${variant%%=*}
          mkdir -p {{.OUTPUT_ABS}}/exp-systemd/debs/$name
          docker buildx build \
            --file image/systemd/Dockerfile \
            --target debs \
            --platform linux/amd64 \
            $({{.VERSIONS}} args ubuntu systemd-source) \
            --build-arg MESON_EXTRA="${variant#*=}" \
            --build-arg JOBS={{.QEMU_JOBS}} \
            --output type=local,dest={{.OUTPUT_ABS}}/exp-systemd/debs/$name \
            .

  builder:
    desc: Build the container that builds the base image (mkosi, qemu-utils).
    internal: true
    cmds:
      - |
        docker buildx build \
          --file image/Dockerfile \
          --platform linux/amd64 \
          --cache-from {{.IMAGE_CACHE_FROM}} \
          {{.IMAGE_CACHE_TO}} \
          $({{.VERSIONS}} args ubuntu mkosi task git-lfs buildkit) \
          --tag {{.IMAGE_BUILDER_TAG}} \
          --load \
          .
