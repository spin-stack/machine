version: '3'

# The base image. See image/mkosi.conf for what goes into it and image/build.sh for how the
# tree becomes a partitionless ext4 in a read-only qcow2.

tasks:

  build:
    desc: Build rootfs.qcow2 (Ubuntu 26.04 userland, ext4, partitionless) into _output/.
    cmds:
      - task: systemd
      - task: builder
      - mkdir -p {{.OUTPUT_ABS}} {{.MKOSI_CACHE_DIR}}
      # `docker run` and not `docker buildx build`, and the reason is in image/Dockerfile:
      # mkosi assembles a root filesystem by unsharing a user and mount namespace and
      # BuildKit forbids that. The flags below are exactly what it needs and nothing more —
      # not --privileged.
      - |
        docker run --rm \
          --security-opt seccomp=unconfined \
          --security-opt apparmor=unconfined \
          --cap-add SYS_ADMIN \
          -v {{.OUTPUT_ABS}}:/out \
          -v {{.MKOSI_CACHE_DIR}}:/cache \
          -v {{.OUTPUT_ABS}}/systemd:/debs:ro \
          {{.IMAGE_BUILDER_TAG}}

  summary:
    desc: What the built base image is, by size and sha256.
    cmds:
      - |
        set -e
        ls -la {{.OUTPUT_ABS}}/image/rootfs.qcow2
        echo "sha256: $(sha256sum {{.OUTPUT_ABS}}/image/rootfs.qcow2 | cut -d' ' -f1)"

  systemd:
    desc: >-
      Build the systemd the base image installs, Ubuntu's rebuilt from its source package
      (image/systemd/Dockerfile), into _output/systemd/.
    cmds:
      # Emptied first, as qemu:build's output is: --output writes files and removes none, and a
      # package this build stopped producing would still be installed by the image.
      - rm -rf {{.OUTPUT_ABS}}/systemd
      - mkdir -p {{.OUTPUT_ABS}}/systemd
      - |
        docker buildx build \
          --file image/systemd/Dockerfile \
          --target debs \
          --platform linux/amd64 \
          --cache-from {{.SYSTEMD_CACHE_FROM}} \
          {{.SYSTEMD_CACHE_TO}} \
          $({{.VERSIONS}} args ubuntu systemd-source) \
          --build-arg JOBS={{.QEMU_JOBS}} \
          --output type=local,dest={{.OUTPUT_ABS}}/systemd \
          .

  builder:
    desc: Build the container that builds the base image (mkosi, qemu-utils).
    internal: true
    cmds:
      - |
        docker buildx build \
          --file image/Dockerfile \
          --platform linux/amd64 \
          --cache-from {{.IMAGE_CACHE_FROM}} \
          {{.IMAGE_CACHE_TO}} \
          $({{.VERSIONS}} args ubuntu mkosi task git-lfs buildkit) \
          --tag {{.IMAGE_BUILDER_TAG}} \
          --load \
          .
