# Every input this repository pins from outside it: a base image, an upstream tarball, a
# commit, the day a package archive is read as of.
#
# This file is the only place one is written. The Dockerfiles declare each as an ARG with no
# default and are handed it (`versions args <name>...`, go-tools' command on Task's PATH); internal/build and
# internal/release read from here; gates/pins_test.go fails on a digest or a commit written
# anywhere else, and on a Dockerfile ARG that falls back to a default of its own.
#
# `spin-machine-dev outdated` says what is behind, and `spin-machine-dev bump <name> [version]` resolves the
# pin of a version and rewrites that entry's two lines and nothing else. Nothing is built by a
# bump. What a bump is then checked with is the entry's note.
#
# The machine's record (machine.CanResume) holds none of these but QEMU's version, which a
# checkpoint crosses upward: a qemu bump keeps the machine type, and boot:compat says whether the
# release before's checkpoints still resume on it; a kernel or toolchain bump is every guest's
# next boot, not a stranded checkpoint. A bump is still its own commit.
#
# Each entry:
#   kind     image:    an OCI image; version its tag, pin its digest. A Docker Hub image is
#                      mirror.gcr.io's copy, the same manifest: Docker Hub counts every
#                      anonymous pull, a digest lookup included, against the address.
#            git:      a repository built here; version the branch it is on, pin the commit.
#            download: a file; source its URL with {version} (and {major}), pin its sha256.
#            date:     a point in time; version the date, no pin.
#            module:   a Go command; source its package, version the module's, no pin (the
#                      checksum database holds it to its bytes).
#   track    how check finds the newest:
#            digest          the tag's digest now: the version stays, the image moves
#            today           today's date
#            kernel          the newest release of the pinned series; another series is a person's to name
#            tags <repo>     the highest version-numbered tag of a git repository
#            branch          the commit the version's branch is at now
#            commit <repo> <branch>
#                            the commit <branch> of <repo> is at now: a download whose version is
#                            a commit, from a project whose releases do not carry the file
#            github-release <repo>
#                            the newest release of a GitHub repository
#   note     why it is pinned where it is, and what a bump has to be checked with.

- name: qemu
  kind: download
  source: https://download.qemu.org/qemu-{version}.tar.xz
  version: 11.2.0-rc0
  pin: 1055588c7acb8b083ca69c3f8625ca240de823e6a34b02b16fa8cabeb1be49be
  track: tags https://gitlab.com/qemu-project/qemu.git
  note: >-
    qemu/Dockerfile. A new emulator of the same machine: the machine type (machine.Type)
    stays, and `spin-machine-dev bump qemu` prints what newer types change against it. After the
    bump: `spin-machine-dev build qemu`, `spin-machine-dev verify qemu args` (args holds patches
    0001-0004, qemu/README.md, "The patches"), then `task boot:record boot:patches boot:compat boot:checkpoint-pause boot:finish-migrate`
    (boot:patches holds 0002's guest half, 0005 and 0006)
    (or `spin-machine-dev lab dispatch check:TARGET` with the bump's parts.yml run, on the bench).
    checkpoint-pause is for a QEMU that stops the guest early again (~200 ms against ~15, held
    under 50), and finish-migrate for a migration that reorders migration_completion_end and
    migration_iteration_finish, or adds a run state after completed, which only a busy host shows
    (#425). The build directories' cache mounts are keyed by the
    version, so QEMU_CONFIG_REV does not move with it.
    A device renamed or dropped upstream fails `spin-machine-dev verify qemu` or `verify args`, and is fixed in
    qemu/devices.mak or the machine package, not by removing the check. So does a QMP command or
    member the module defines that QEMU renamed, dropped or deprecated; once it is fixed, record
    the schema CI checks against with `go test ./internal/qmpdef -run TestQEMUKnowsEveryCommand -record`.

