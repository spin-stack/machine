- name: kernel
  kind: download
  source: https://cdn.kernel.org/pub/linux/kernel/v{major}.x/linux-{version}.tar.xz
  version: 7.3.5
  pin: 8f293f83d54f0b7b9be56863ebc5e4ea79d73e530b4ae55c572be97ef39f0990
  track: kernel
  note: >-
    kernel/Dockerfile. A new kernel for every guest's next boot; checkpoints keep resuming, each
    on the kernel it was saved with, which the machine's record leaves out. The configuration
    is the series', kernel/config-<major>.<minor>-x86_64, so a release within the series moves
    this entry and nothing else: refresh.yml proposes it every day, and parts.yml builds it on
    the pull request. The build fails a kernel that lost the effect of one of kernel/patches,
    naming it (kernel/README.md, "Changing it"): read that patch again against the new source;
    compat.yml boots the kernel (boot:lockdown), and boot:patches holds its cold boot under a
    port I/O exit budget, which fails when 0004 or 0010 builds in but earns nothing on the
    running machine (MMCONFIG set up after PCI enumeration, early_quirks() scanning bus 0).
    Before merging, boot it: `spin-machine-dev build kernel`, then `task boot:ssh-first`. A new series
    renames the configuration in the same commit, then `spin-machine-dev build kernel`, `task
    boot:ssh-first`. The series is a person's choice, the same as spin-ami's host kernel.

