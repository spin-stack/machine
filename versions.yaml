    names a process by what it became, labels it with its cgroup v2 unit, and keeps every process
    that ran; Ubuntu's 235 did none of it on this machine (spin-stack/machine#521). The tree that
    carries it boots with it as PID 1, which samples the boot and execs systemd. Pinned to a commit
    of the fork's main: `spin-machine-dev bump systemd-bootchart <commit>` moves it. After
    the bump: `spin-machine-dev lab dispatch bootchart --tree 'release=--from release --edit
