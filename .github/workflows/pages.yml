name: Pages

# Each release's numbers as one web page to share, https://spin-stack.github.io/spin-machine/:
# the chart, the tables of docs/releases.md and each record, written from docs/releases/*.json by
# spin-machine-dev releases site (docs/cli.md). A merge that changes a record publishes it again;
# nothing else on the page can change without one. Not a required check, so a paths filter is safe.

on:
  push:
    branches: [main]
    paths:
      - "docs/releases/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and none cancelled: each is the records as of a merge, and the last to
# finish is the one the page shows.
concurrency:
  group: pages
  cancel-in-progress: false

# As ci.yml: go-tools' downloads ask GitHub with it, which sheds anonymous ones first.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: spin-machine-dev
        run: go tool task bin

      - name: Write the site
        run: spin-machine-dev releases site --out _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the site
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
