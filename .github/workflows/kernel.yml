name: Kernel

# The guest kernel, for the same reason QEMU has its own workflow: compiling it is tens of
# minutes and the merge gate must not wait for it.
#
# It matters more than a build time, though: a changed kernel is every guest's next boot. It
# does not strand checkpoints - a resumed guest runs the kernel in its saved memory, and the
# fingerprint is the machine's contract, not this binary - but the job prints the checksum of
# what it produced, so a config change is something somebody looked at.

on:
# kernel/**, and versions.yaml when it moves the kernel or its toolchain; see the note in
# qemu.yml.
  push:
    branches: [main]
    paths:
      - kernel/**
      - cmd/spin-machine-dev/**
      - internal/build/**
      - versions.yaml
      - go.mod
      - .github/workflows/kernel.yml
  pull_request:
    paths:
      - kernel/**
      - cmd/spin-machine-dev/**
      - internal/build/**
      - versions.yaml
      - go.mod
      - .github/workflows/kernel.yml
  workflow_dispatch:

permissions:
  contents: read
  # The BuildKit cache: main writes it, everything else reads it (internal/build.CacheRegistry).
  packages: write

concurrency:
  group: kernel-${{ github.head_ref || github.ref_name }}
  # Never on main: a cancelled run there is a commit nobody proved.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# As ci.yml: go-tools' downloads ask GitHub with it, which sheds anonymous ones first.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # Whether this change can reach the kernel; see the note in qemu.yml.
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.touches.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # spin-machine-dev built and on the PATH, so a step's exit status is the verb's (go run makes
      # it 1): the verbs below are the ones a person types (docs/cli.md).
      - name: spin-machine-dev
        run: go tool task bin

      - name: Does the change reach the kernel
        id: touches
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: spin-machine-dev changed --base "$BASE" --pins debian,debian-snapshot,kernel,moby-check-config kernel go.mod cmd/spin-machine-dev internal/build .github/workflows/kernel.yml

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # spin-machine-dev is Go, and reads the build's pins from versions.yaml.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # spin-machine-dev built and on the PATH, so a step's exit status is the verb's (go run makes
      # it 1): the verbs below are the ones a person types (docs/cli.md).
      - name: spin-machine-dev
        run: go tool task bin

      # A builder of its own (the docker-container driver): Docker's default one cannot export its
      # cache. What it reads and writes is the cache image in GitHub's registry that the build
      # names (--cache-registry, internal/build.CacheRegistry), so the runner itself keeps nothing between runs.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The cache is one of this repository's packages, and reading it takes a login as much as
      # writing it does. Without one BuildKit says it could not import the cache, carries on
      # without it, and the build passes at the cold time.
      - name: Log in to GitHub Packages
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ends in verifying it (spin-machine-dev verify kernel), which reads the bzImage's setup header (a relocatable
      # bzImage, or KASLR is off) and checks vmlinux's Xen PVH notes survived the strip.
      # Without either, the failure is a VM that does not start or a kernel at a fixed
      # address, in whichever lane boots one next.
      #
      # And what it produced, by sha256, on the run's summary: a pull request that changes the
      # config, or bumps the Debian toolchain the kernel is compiled with, changes every guest's
      # next boot, and the change that does it need not look like much. Checkpoints are not
      # affected: the kernel is not in the fingerprint (machine.Spec.Fingerprint).
      - name: Build the kernel
        env:
          # main's lanes write the cache back; everything else only reads it.
          CACHE_EXPORT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: spin-machine-dev build kernel --jobs 4 --cache-registry --cache-export="$CACHE_EXPORT"

      # Still named vmlinux-<sha>: lab:fetch finds a kernel run's artifact by that name.
      - name: Upload the kernel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vmlinux-${{ github.sha }}
          path: |
            _output/kernel/bzImage
            _output/kernel/vmlinux
            _output/kernel/kernel-config
          retention-days: 30
          if-no-files-found: error
