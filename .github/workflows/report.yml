name: Report

# Each release's numbers, measured and kept in the repository: the release booted interleaved with
# the release before it on one bench host, each with the spin-machine of the commit it was made
# from, in the shape spin boots a workspace in - the two goal numbers (a cold boot and a restore,
# each to the first SSH login), both again into a QEMU started ahead, and save, state, kernel and
# QEMU RSS as diagnostics, and the no-systemd floor beside the release, a bound (docs/measuring.md,
# rule 8) - written to docs/releases/RELEASE.json with the release before it and
# each Δ against it, one boot of the release drawn beside it (RELEASE-bootchart.svg and
# RELEASE-plot.svg, and its dependency view, RELEASE-chain.txt and RELEASE-order.dot and .svg,
# docs/measuring.md, "Boot charts"), and docs/releases.md written again from every record (spin-machine-dev
# releases, docs/cli.md). The records are proposed as a pull request as the release app, so the
# checks on it run.
#
# Two commits: a release is measured with its tag's code, and recorded with main's. The page and
# its chart are what main's code writes from the records, and main's test fails on any other: a
# page written by the tag's code, proposed on main after main's chart had changed, failed it
# (v20261120.04's record, #350).
#
# With the release before it, a ladder of two: a Δ between two runs is the bench's drift as much as
# the release's (v20261120.01's restore to first login was 158.9 ms p50 in one run and 167.0 in
# another, labs 44641240861 and 44727451080), so the page's Δ is only ever the pair's. It costs
# the second release's boots on every run, which measuring alone saved. A workflow of its own
# because it boots: GitHub's runners have no /dev/kvm, and the goal is measured on the bench
# fleet's nested c8id.
#
# A release whose goal number regressed against the release before it is flagged as an issue
# (releases flag), and withdrawn only by a person (withdraw.yml).
#
# release.yml calls it with record once a release is out. By hand, it measures past releases one
# after another, each with its own predecessor, and proposes them together: what releases missing
# lists, to take the page back in time, and the records measured alone, to give them a Δ.

on:
  workflow_call:
    inputs:
      versions: { type: string, required: true }
      ref: { type: string, required: true }
      record: { type: boolean, default: false }
  workflow_dispatch:
    inputs:
      versions:
        description: "The releases measured, each with the one before it, space-separated, e.g. v20261119.01 v20261119.02 (default the newest published)"
        type: string
        default: ""
      record:
        description: "Propose their records and docs/releases.md as a pull request"
        type: boolean
        default: false

permissions:
  contents: read

# As ci.yml: go-tools' downloads ask GitHub with it, which sheds anonymous ones first.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  report:
    runs-on: runs-on/fleet=bench/env=production
    timeout-minutes: 360
    permissions:
      contents: read
      # The issue releases flag opens for a release that regressed.
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSIONS: ${{ inputs.versions }}
    steps:
      # The measuring verbs from the ref asked for - the release's own tag when release.yml calls -
      # and, by hand, from where the run started. The releases measured each boot with their own
      # spin-machine whatever this ref is.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          # The records are pushed as the app, below, and not with this run's token.
          persist-credentials: false

      # Go's caches come back from the fleet's cache (its S3 bucket): the instance starts with
      # nothing.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: spin-machine-dev
        run: go tool task bin

      # The guests' vsock transport, loaded and made this user's: a module on the fleet's kernel
      # that nothing loads before the first QEMU opens /dev/vhost-vsock.
      - name: Load vhost_vsock
        run: go tool task vsock

      # graphviz draws the bootchart probe's ordering graph, which it keeps as dot without it.
      - name: Install graphviz
        run: go tool task graphviz

      # Unquoted: one word a release.
      - name: Measure each release with the one before it
        run: spin-machine-dev releases measure $VERSIONS --reps 20

      # Every sample, which a record keeps only the p50 and p95 of: lab show DIR reads one release's.
      # Only the ladders and each release's boot charts, dependency view and ledger: a release's
      # tarball, downloaded beside them, is 1.5 GB (run 44734233084).
      - name: Keep the ladders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-${{ github.run_id }}
          path: |
            _output/lab/measured/*/ladder.json
            _output/lab/measured/*/bootchart.json
            _output/lab/measured/*/*.svg
            _output/lab/measured/*/*.chain.txt
            _output/lab/measured/*/*.order.dot
            _output/lab/measured/*/ledger.json
            _output/lab/measured/*/*.ledger.*
            _output/lab/measured/*/*.trace.txt
            _output/lab/measured/*/*.journal.txt
          retention-days: 90
          if-no-files-found: ignore

      # The records, the page and the proposal are main's code, in a checkout of its own beside the
      # measured one: the ladders above stay where they were measured.
      - name: Checkout main
        if: ${{ inputs.record && !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false

      # Main's spin-machine-dev, first on PATH from here on: the runner puts the directory added
      # last before the ones added earlier.
      - name: Main's spin-machine-dev
        if: ${{ inputs.record && !cancelled() }}
        working-directory: main
        run: go tool task bin

      # What a lost measurement left recorded (measure's 1) is recorded too, its dash saying why.
      - name: Record each release
        if: ${{ inputs.record && !cancelled() }}
        working-directory: main
        run: spin-machine-dev releases record ../_output/lab/measured/*/ladder.json --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # An issue for each release whose goal number regressed against the release before it, beyond
      # noise, with the commits between them: a person decides whether to withdraw it
      # (docs/releasing.md, "Withdrawing a release"). Main's code, as the record is: the release's tag
      # may be older than the verb.
      - name: Flag a regression
        if: ${{ inputs.record && !cancelled() }}
        working-directory: main
        run: spin-machine-dev releases flag ../_output/lab/measured/*/ladder.json --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Each release's QEMU's query-qmp-schema, which go test holds the machine package to
      # (internal/qmpdef/testdata/released): proposed with the record, so the next change is checked
      # against the QEMU this release ships, with no VM. Unquoted: one word a release.
      - name: Record each release's QMP schema
        if: ${{ inputs.record && !cancelled() }}
        working-directory: main
        run: spin-machine-dev releases schema $VERSIONS

      # The app's token is made here and not first: it lasts an hour, and measuring past releases
      # takes longer.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: ${{ inputs.record && !cancelled() }}
        with:
          client-id: Iv23licJKNgsPIM00SD0 # spin-stack-release's client ID, public: app-id is deprecated
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: spin-stack
          repositories: machine

      - name: Commit as the app
        if: ${{ inputs.record && !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        working-directory: main
        run: go tool task git:app

      - name: Propose the records
        if: ${{ inputs.record && !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        working-directory: main
        run: spin-machine-dev releases propose
