name: Report

# Each release's numbers, measured and kept in the repository: the release booted alone on one
# bench host with the spin-machine of the commit it was made from - the two goal numbers (a cold
# boot and a restore, each to the first SSH login), both again into a QEMU started ahead, and save,
# state, kernel and QEMU RSS as diagnostics - written to docs/releases/RELEASE.json, and
# docs/releases.md written again from every record (spin-machine-dev releases, docs/cli.md). The
# records are proposed as a pull request as the release app, so the checks on it run.
#
# Alone, a ladder of one: each record is a run of its own, and the page says a Δ between two runs
# is read against the noise between them. Interleaving with the release before cost a second
# release's boots on every run, and the five-release ladder this replaced booted the same releases
# again and again (~13 min) to publish a table no one kept. A decision between two releases is a
# ladder of them, measured together (lab ladder). A workflow of its own because it boots: GitHub's
# runners have no /dev/kvm, and the goal is measured on the bench fleet's nested c8id.
#
# release.yml calls it with record once a release is out. By hand, it measures past releases one
# after another, each alone, and proposes them together: what releases missing lists, to take the
# page back in time.

on:
  workflow_call:
    inputs:
      versions: { type: string, required: true }
      ref: { type: string, required: true }
      record: { type: boolean, default: false }
  workflow_dispatch:
    inputs:
      versions:
        description: "The releases measured, each alone, space-separated, e.g. v20261119.01 v20261119.02 (default the newest published)"
        type: string
        default: ""
      record:
        description: "Propose their records and docs/releases.md as a pull request"
        type: boolean
        default: false

permissions:
  contents: read

# As ci.yml: go-tools' downloads ask GitHub with it, which sheds anonymous ones first.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  report:
    runs-on: runs-on/fleet=bench/env=production
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      VERSIONS: ${{ inputs.versions }}
    steps:
      # The verbs from the ref asked for - the release's own tag when release.yml calls - and, by
      # hand, from where the run started. The releases measured each boot with their own
      # spin-machine whatever this ref is.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          # The records are pushed as the app, below, and not with this run's token.
          persist-credentials: false

      # Go's caches come back from the fleet's cache (its S3 bucket): the instance starts with
      # nothing.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: spin-machine-dev
        run: go tool task bin

      # The guests' vsock transport, loaded and made this user's: a module on the fleet's kernel
      # that nothing loads before the first QEMU opens /dev/vhost-vsock.
      - name: Load vhost_vsock
        run: go tool task vsock

      # Unquoted: one word a release.
      - name: Measure each release alone
        run: spin-machine-dev releases measure $VERSIONS --reps 20 --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Every sample, which a record keeps only the p50 and p95 of: lab show DIR reads one release's.
      # Only the ladders: a release's tarball, downloaded beside them, is 1.5 GB (run 44734233084).
      - name: Keep the ladders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-${{ github.run_id }}
          path: _output/lab/measured/*/ladder.json
          retention-days: 90
          if-no-files-found: ignore

      # The app's token is made here and not first: it lasts an hour, and measuring past releases
      # takes longer. What a lost measurement left recorded (measure's 1) is proposed too, its dash
      # saying why.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: ${{ inputs.record && !cancelled() }}
        with:
          client-id: Iv23licJKNgsPIM00SD0 # spin-stack-release's client ID, public: app-id is deprecated
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: spin-stack
          repositories: spin-machine

      - name: Commit as the app
        if: ${{ inputs.record && !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: go tool task git:app

      - name: Propose the records
        if: ${{ inputs.record && !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: spin-machine-dev releases propose
