name: Report

# The machine's evolution, measured: the newest releases booted together on one bench host, each
# with the spin-machine of the commit it was made from, the two goal numbers (a cold boot and a
# restore, each to the first SSH login) and both again into a QEMU started ahead, with save, state,
# kernel and QEMU RSS beside them as diagnostics (spin-machine-dev lab ladder, docs/cli.md).
#
# Interleaved on one host because that is the only comparison the bench leaves honest: two
# reports taken on different days said v20261119.02 accepted SSH 7.3% later than v20261119.01,
# and the same two interleaved said it did not. A workflow of its own because it boots: GitHub's
# runners have no /dev/kvm, and the goal is measured on the bench fleet's nested c8i.
#
# release.yml calls it with publish once a release is out: ladder.json goes up as that release's
# asset and the table ends its notes. Weekly, the same ladder of the newest releases, kept as the
# run's artifact (lab show RUN_ID reads it): it watches the fleet and the releases between
# publishes, and is not a release's record. By hand, any release as the newest.

on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
      ref: { type: string, required: true }
      publish: { type: boolean, default: false }
  workflow_dispatch:
    inputs:
      version:
        description: "The newest release measured, e.g. v20261119.02 (default the newest published)"
        type: string
        default: ""
      releases:
        description: "How many releases, the newest up to version"
        type: number
        default: 5
      publish:
        description: "Upload ladder.json to that release and end its notes with the table"
        type: boolean
        default: false
  schedule:
    # Mondays, early: the bench is quiet, and a week of releases and fleet changes is behind it.
    - cron: '17 3 * * 1'

permissions:
  contents: write

# As ci.yml: go-tools' downloads ask GitHub with it, which sheds anonymous ones first.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  report:
    runs-on: runs-on/fleet=bench/env=production
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      RELEASES: ${{ inputs.releases || 5 }}
    steps:
      # The ladder from the ref asked for - the release's own tag when release.yml calls - and,
      # by hand or on a schedule, from where the run started. The releases it measures each boot
      # with their own spin-machine whatever this ref is.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Go's caches come back from the fleet's cache (its S3 bucket): the instance starts with
      # nothing.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: spin-machine-dev
        run: go tool task bin

      # The guests' vsock transport, loaded and made this user's: a module on the fleet's kernel
      # that nothing loads before the first QEMU opens /dev/vhost-vsock.
      - name: Load vhost_vsock
        run: go tool task vsock

      - name: Measure the ladder
        run: spin-machine-dev lab ladder --newest "$VERSION" --releases "$RELEASES" --reps 20 --out _output/lab/result

      - name: Keep the ladder
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-${{ github.run_id }}
          path: _output/lab/result/ladder.json
          if-no-files-found: ignore

      - name: Publish the ladder
        if: inputs.publish
        run: spin-machine-dev lab publish _output/lab/result
