name: Compat

# Whether a checkpoint every recent release saved resumes on this change's machine, and whether the
# machine's record still refuses what QEMU loads silently and accepts the machine's own checkpoint
# (boot:compat, boot:record): on every pull request and push to main that changes what a resumed
# guest is loaded into - the machine's definition, QEMU, the kernel, the firmware and their pins -
# and before every release. And whether that kernel, booted, is locked down (boot:lockdown) and at
# a random base every boot (boot:kaslr), and whether a guest checkpointed and continued still grows
# (boot:cpu-plug).
#
# How long a checkpoint stops the guest (boot:checkpoint-pause) is a bound, not compatibility: it
# runs on the bench, on each release (release.yml's pause) and at a QEMU bump (versions.yaml).
# Whether the library still speaks every supported release's QEMU is go test's, in seconds
# (internal/qmpdef, testdata/released).
#
# On the KVM fleet (spin-stack/ci), because it boots: the newest release is unpacked as the machine
# before, and the machine here is that tree with this change's QEMU, firmware and kernel over it -
# the base image is the release's, since a checkpoint resumes with the disks it was saved with. A
# part the change does not reach is not built: QEMU is main's published one (fetch qemu), and the
# kernel the release's own, because a resumed guest runs the kernel in its saved memory. A part it
# reaches is built, reading the BuildKit cache main's lanes export (--cache-registry). A release
# (workflow_call) builds both, so what it checks is what it ships.
#
# The test holds the promise only where it is made: when this machine refuses a release's
# checkpoint the machine moved on purpose, and the run's summary says so with every difference.
#
# `compat` at the end says whether the run passed or was not needed: one check, which a ruleset can
# require, as parts.yml's `parts` is. A path filter would leave it unreported on a change that does
# not reach the machine, and a required check that never reports blocks the merge.

on:
  # No paths: `compat` has to report on every change, and `changed` below is the filter.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: "What the branch is compared with to decide which parts it builds (none builds every part)"
        type: string
        default: origin/main
  workflow_call:

permissions:
  contents: read
  # The BuildKit cache main's lanes write (internal/build.CacheRegistry), and the QEMU main
  # publishes (fetch qemu).
  packages: read

# Never cancelled on main or in a release: a run there is a commit somebody needs the answer for,
# and a release's waits on it. A pull request's newer push makes its older run moot. Called from
# release.yml it is the release's job and takes its group.
concurrency:
  group: compat-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# As ci.yml: go-tools' downloads ask GitHub with it, which sheds anonymous ones first.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # Whether this change reaches what a resumed guest is loaded into, and which of QEMU and the
  # kernel it reaches: what each build is handed (its pins in versions.yaml) at the base and here,
  # and the paths it is built from, as parts.yml's `changed`. It errs towards building: a release
  # has no base, and builds both.
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      machine: ${{ steps.machine.outputs.build }}
      qemu: ${{ steps.qemu.outputs.build }}
      kernel: ${{ steps.kernel.outputs.build }}
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit has to be here to be compared against.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # spin-machine-dev built and on the PATH, so a step's exit status is the verb's (go run makes
      # it 1): the verbs below are the ones a person types (docs/cli.md).
      - name: spin-machine-dev
        run: go tool task bin

      # The machine's definition, what builds and boots it here, the checks below, and QEMU's and
      # the kernel's own inputs: everything the two steps after it name, and more. Not image/: every
      # run boots the release's base image, so a change to it reaches nothing this checks.
      - name: Does the change reach the machine
        id: machine
        run: spin-machine-dev changed --base "$BASE" --part qemu --part kernel machine cmd/spin-machine cmd/spin-machine-dev internal/build internal/lab/compat.go internal/lab/tree.go internal/lab/sources.go boot/harness_test.go boot/record_test.go boot/patches_test.go boot/events_test.go boot/verbs_test.go boot/cpuplug_test.go boot/lockdown_test.go boot/testdata/lockdown-check.sh boot/testdata/keyring-probe boot/Taskfile.yml go.mod .github/workflows/compat.yml

      - name: Does the change reach QEMU
        id: qemu
        run: spin-machine-dev changed --base "$BASE" --part qemu go.mod cmd/spin-machine-dev internal/build

      - name: Does the change reach the kernel
        id: kernel
        run: spin-machine-dev changed --base "$BASE" --part kernel go.mod cmd/spin-machine-dev internal/build

  resume:
    needs: changed
    if: needs.changed.outputs.machine == 'true'
    runs-on: runs-on/fleet=kvm/env=production
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go's caches come back from the fleet's cache (its S3 bucket): the instance starts with
      # nothing.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A builder that can read a cache Docker's own cannot.
      - name: A BuildKit that reads the lanes' cache
        if: needs.changed.outputs.qemu == 'true' || needs.changed.outputs.kernel == 'true'
        run: go tool task boot:buildkit

      # The cache and the published QEMU are this repository's packages, and reading either takes
      # a login: without one BuildKit carries on without the cache and compiles QEMU and the kernel
      # cold.
      - name: Log in to GitHub Packages
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # spin-machine-dev built and on the PATH, so a step's exit status is the verb's (go run makes
      # it 1): the verbs below are the ones a person types (docs/cli.md).
      - name: spin-machine-dev
        run: go tool task bin

      # The guests' vsock transport, loaded and made this user's: a module on the fleet's kernel
      # that nothing loads before the first QEMU opens /dev/vhost-vsock.
      - name: Load vhost_vsock
        run: spin-machine-dev vsock

      # Reads the lanes' caches and writes none back: main's lanes keep them current. No build
      # argument depends on the runner (a compile takes its parallelism from nproc inside the RUN),
      # so this runner hits the lanes' cache: a runner-sized argument once missed it, and this step
      # compiled QEMU and the kernel again on every push - 8 of compat's 12 minutes, on a release's
      # critical path (release 44641240861, every builder RUN step uncached).
      - name: Build this change's QEMU
        if: needs.changed.outputs.qemu == 'true'
        run: spin-machine-dev build qemu --cache-registry --cache-export=false

      # Main's QEMU of the pinned version, in seconds: the change does not reach it. Compiled here
      # it took ~4 of a run's ~10 minutes, from a cache that missed (run 44974499826).
      - name: Main's published QEMU
        if: needs.changed.outputs.qemu != 'true'
        run: spin-machine-dev fetch qemu

      - name: Build this change's kernel
        if: needs.changed.outputs.kernel == 'true'
        run: spin-machine-dev build kernel --cache-registry --cache-export=false

      # The newest release, checked against its sha256 and its signature, as the machine before;
      # this change's machine is the same tree with the QEMU above and the kernel built, if any,
      # in place of its own. The steps after boot that tree: it is their SPIN_MACHINE_OUTPUT.
      - name: The machine before, and this one
        run: go tool task boot:here

      - name: The machine's record refuses what QEMU loads silently, and not its own checkpoint
        run: go tool task boot:record

      # A machine that asks for a TPM gets one its guest uses as shirudo does, and a checkpoint
      # carries it (#719). A tree whose kernel has no tpm_crb driver, a release's from before #733,
      # skips, saying so.
      - name: A machine with a TPM uses it across a checkpoint
        run: go tool task boot:tpm

      # A machine given a NIC on passt reaches the internet with nothing on the host but the user
      # running it, and its guest is configured by its command line alone (#751).
      - name: A guest on passt reaches the internet
        run: go tool task boot:net

      # A patch dropped at a bump, or rebased into doing nothing, still builds and boots; this is
      # where it fails (qemu/README.md, "The patches").
      - name: Each QEMU and qboot patch does what it is carried for, seen from a guest
        run: go tool task boot:patches

      # A QEMU or a kernel that lost a hotplug after a migration would leave a workspace
      # checkpointed with memory at the size it was (#433).
      - name: A workspace checkpointed and continued still grows
        run: go tool task boot:cpu-plug

      # Every release until one whose machine is not this one, not only the one before: a host may
      # skip releases, and its checkpoints still resume.
      - name: A checkpoint of every release whose machine is this one resumes here
        run: spin-machine-dev lab compat --here "$SPIN_MACHINE_OUTPUT"

      # The tree's kernel, booted: lockdown that root cannot lower, at confidentiality with its
      # keyrings sealed, at integrity with them open for a shirudo machine (#734, #741), the BPF
      # LSM, no /dev/mem or /proc/kcore, and _text at a random address. kernel/Dockerfile checks
      # the config; this checks the kernel that came out of it, entered the way this change
      # enters it. A change that does not reach the kernel boots the release's, checked when it
      # was built.
      - name: The kernel is locked down
        run: go tool task boot:lockdown

      # The same kernel across ten boots: its virtual base, its physical base and the regions
      # RANDOMIZE_MEMORY moves each take more than one value and never the unrandomized one. One
      # boot cannot tell a random address from a fixed one, and the vmlinux the machine enters
      # through PVH is randomized by kernel/patches/0014-0020 and qemu/patches/0008, none of which
      # anything else here would miss (#645).
      - name: The kernel is somewhere else every boot
        run: go tool task boot:kaslr

  # The run passed, or the change does not reach the machine: the one check of this workflow a
  # ruleset can require. A `resume` that failed or was cancelled, or a `changed` that could not
  # say, is not a pass.
  compat:
    needs: [changed, resume]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: spin-machine-dev
        run: go tool task bin

      - name: The change resumes every release's checkpoint, or does not reach the machine
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: spin-machine-dev needs
