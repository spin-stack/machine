# Every day, the newest release of the guest kernel's series, proposed as a pull request
# (spin-machine-dev refresh kernel). A stable release is mostly fixes that were never called CVEs, or were
# called one after the fix was out, so taking them is the cheapest security this machine has:
# within the series the configuration does not change (kernel/config-<series>-x86_64) and
# checkpoints keep resuming, so a stable release is one versions.yaml line. parts.yml builds it
# on the pull request; a person boots it and merges it. Nothing here publishes.
#
# And the systemd source package the image rebuilds (spin-machine-dev refresh systemd), which the archive
# stops serving the day Ubuntu replaces it.
#
# And, weekly, QEMU's and e2fsprogs' builder images (spin-machine-dev refresh builders): Alpine with
# each part's apk.list installed, made again, published, and proposed when a package in them moved.
# parts.yml builds the pull request.
#
# The pull request is the release app's (spin-stack-release), so the checks on it run: one opened
# with this run's own token would start none.
name: Refresh

on:
  schedule:
    - cron: "41 6 * * *"
    # The builders' (the job says why weekly).
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

# As ci.yml: go-tools' downloads ask GitHub with it, which sheds anonymous ones first.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  kernel:
    if: github.ref == 'refs/heads/main' && github.event.schedule != '17 7 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: Iv23licJKNgsPIM00SD0 # spin-stack-release's client ID, public: app-id is deprecated
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: spin-stack
          repositories: spin-machine

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch is pushed as the app, below, and not with this run's token.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Commit as the app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: go tool task git:app

      # spin-machine-dev built and on the PATH, so a step's exit status is the verb's (go run makes
      # it 1): the verbs below are the ones a person types (docs/cli.md).
      - name: spin-machine-dev
        run: go tool task bin

      - name: Propose the kernel's newest release
        env:
          # versions refresh opens the pull request as GITHUB_TOKEN before GH_TOKEN, and the run's
          # own, set above, can neither open it nor start the checks on it; git pushes through gh,
          # as GH_TOKEN.
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: spin-machine-dev refresh kernel

  # Its own job, as apk's: the refresh leaves the checkout on the branch it proposed. Ubuntu's
  # archive serves only the systemd source resolute publishes now, so image/systemd fails to build
  # from the day it moves until the pin follows; this proposes the move that day. parts.yml builds
  # the pull request.
  systemd:
    if: github.ref == 'refs/heads/main' && github.event.schedule != '17 7 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: Iv23licJKNgsPIM00SD0 # spin-stack-release's client ID, public: app-id is deprecated
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: spin-stack
          repositories: spin-machine

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch is pushed as the app, below, and not with this run's token.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Commit as the app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: go tool task git:app

      # spin-machine-dev built and on the PATH, so a step's exit status is the verb's (go run makes
      # it 1): the verbs below are the ones a person types (docs/cli.md).
      - name: spin-machine-dev
        run: go tool task bin

      - name: Propose the systemd resolute publishes now
        env:
          # versions refresh opens the pull request as GITHUB_TOKEN before GH_TOKEN, and the run's
          # own, set above, can neither open it nor start the checks on it; git pushes through gh,
          # as GH_TOKEN.
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: spin-machine-dev refresh systemd

  # Its own job: each refresh above leaves the checkout on the branch it proposed. Weekly, and not
  # daily as the apk locks it replaced were: a pinned builder keeps its packages after the mirror
  # drops them, so nothing breaks while one waits, and each one taken is QEMU compiled cold.
  # Dispatched on a branch, it makes that branch's builders and commits their pins to it: how an
  # apk.list changed in a pull request gets the builder its build asks for.
  builders:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 7 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The builders are published under the repository's former name, kept for their pins:
      # ghcr.io/spin-stack/spin-machine/builder-*.
      packages: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: Iv23licJKNgsPIM00SD0 # spin-stack-release's client ID, public: app-id is deprecated
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: spin-stack
          repositories: spin-machine

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch is pushed as the app, below, and not with this run's token.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Packages
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit as the app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: go tool task git:app

      # spin-machine-dev built and on the PATH, so a step's exit status is the verb's (go run makes
      # it 1): the verbs below are the ones a person types (docs/cli.md).
      - name: spin-machine-dev
        run: go tool task bin

      - name: Make the builders and propose the ones whose packages moved
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: spin-machine-dev refresh builders
